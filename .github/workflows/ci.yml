name: CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "Prod"
        type: choice
        options:
          - Prod
          - NonProd

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Full integration tests
  # ────────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create output directories
        run: mkdir -p reports data/snowflake_results data/purview_snowflake_results

      - name: Run full test suite
        env:
          SNOWFLAKE_ACCOUNT:           ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:              ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:          ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE:         ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE:              ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_EXCLUDE_DATABASES: ${{ secrets.SNOWFLAKE_EXCLUDE_DATABASES }}
          PURVIEW_ACCOUNT_NAME:        ${{ secrets.PURVIEW_ACCOUNT_NAME }}
          AZURE_TENANT_ID:             ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:             ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:         ${{ secrets.AZURE_CLIENT_SECRET }}
          DOMAIN_NAME:                 ${{ secrets.DOMAIN_NAME }}
          PURVIEW_COLLECTION:          ${{ github.event.inputs.environment }}
        run: pytest --timeout=1800 || true

      - name: Upload report and data snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results-${{ github.event.inputs.environment }}-${{ github.run_number }}
          path: |
            reports/purview_snowflake_connector_report.html
            data/snowflake_results/
            data/purview_snowflake_results/
          retention-days: 30
          if-no-files-found: ignore

[pytest]
testpaths = tests
markers =
    databases: Bidirectional database comparison (Snowflake ↔ Purview)
    schemas: Bidirectional schema comparison (Snowflake ↔ Purview)
    tables: Bidirectional table comparison (Snowflake ↔ Purview)
    views: Bidirectional view comparison (Snowflake ↔ Purview)
    columns: Bidirectional column comparison (Snowflake ↔ Purview)
    stored_procedures: Bidirectional stored procedure comparison (Snowflake ↔ Purview)
addopts = -v --tb=short

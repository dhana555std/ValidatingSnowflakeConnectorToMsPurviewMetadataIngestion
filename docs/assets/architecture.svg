<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="#f8fafc"/>

  <!-- Title -->
  <text x="480" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Purview-Snowflake Metadata Validator</text>
  <text x="480" y="62" text-anchor="middle" font-size="12" fill="#64748b">Automated metadata extraction, comparison and drift detection</text>

  <!-- ═══ SOURCE LAYER ═══ -->

  <!-- Snowflake box -->
  <rect x="32" y="100" width="160" height="120" rx="10" fill="#e0f4fd" stroke="#29b5e8" stroke-width="2"/>
  <text x="112" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#0284c7">SNOWFLAKE</text>
  <!-- snowflake icon (simplified) -->
  <g transform="translate(95,140)" stroke="#29b5e8" stroke-width="2.5" stroke-linecap="round">
    <line x1="17" y1="0"  x2="17" y2="34"/>
    <line x1="0"  y1="17" x2="34" y2="17"/>
    <line x1="5"  y1="5"  x2="29" y2="29"/>
    <line x1="29" y1="5"  x2="5"  y2="29"/>
    <circle cx="17" cy="0"  r="3" fill="#29b5e8" stroke="none"/>
    <circle cx="17" cy="34" r="3" fill="#29b5e8" stroke="none"/>
    <circle cx="0"  cy="17" r="3" fill="#29b5e8" stroke="none"/>
    <circle cx="34" cy="17" r="3" fill="#29b5e8" stroke="none"/>
    <circle cx="5"  cy="5"  r="3" fill="#29b5e8" stroke="none"/>
    <circle cx="29" cy="29" r="3" fill="#29b5e8" stroke="none"/>
    <circle cx="29" cy="5"  r="3" fill="#29b5e8" stroke="none"/>
    <circle cx="5"  cy="29" r="3" fill="#29b5e8" stroke="none"/>
  </g>
  <text x="112" y="193" text-anchor="middle" font-size="10" fill="#0284c7">ACCOUNT_USAGE</text>
  <text x="112" y="208" text-anchor="middle" font-size="10" fill="#64748b">Databases · Schemas</text>
  <text x="112" y="221" text-anchor="middle" font-size="10" fill="#64748b">Tables · Views · Columns</text>

  <!-- MS Purview box -->
  <rect x="32" y="300" width="160" height="120" rx="10" fill="#e8f4fd" stroke="#0078d4" stroke-width="2"/>
  <text x="112" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#0078d4">MS PURVIEW</text>
  <!-- Purview icon (simplified hexagons) -->
  <g transform="translate(90,338)">
    <polygon points="22,0 44,12 44,36 22,48 0,36 0,12" fill="none" stroke="#0078d4" stroke-width="2"/>
    <polygon points="22,8 36,16 36,32 22,40 8,32 8,16"  fill="#bfdbfe" stroke="#0078d4" stroke-width="1.5"/>
    <text x="22" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#0078d4">P</text>
  </g>
  <text x="112" y="398" text-anchor="middle" font-size="10" fill="#0078d4">Commercial Collection</text>
  <text x="112" y="412" text-anchor="middle" font-size="10" fill="#64748b">Catalog Search API</text>
  <text x="112" y="426" text-anchor="middle" font-size="10" fill="#64748b">Atlas Entity Bulk API</text>

  <!-- ═══ CLIENT LAYER ═══ -->

  <!-- SnowflakeClient box -->
  <rect x="250" y="86" width="175" height="148" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="250" y="86" width="175" height="28"  rx="10" fill="#3b82f6"/>
  <rect x="250" y="100" width="175" height="14" fill="#3b82f6"/>
  <text x="337" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">SnowflakeClient</text>
  <text x="337" y="128" text-anchor="middle" font-size="9.5" fill="#475569">extract_all_schemas()</text>
  <text x="337" y="143" text-anchor="middle" font-size="9.5" fill="#475569">extract_all_tables()</text>
  <text x="337" y="158" text-anchor="middle" font-size="9.5" fill="#475569">extract_all_views()</text>
  <text x="337" y="173" text-anchor="middle" font-size="9.5" fill="#475569">extract_all_columns()</text>
  <text x="337" y="188" text-anchor="middle" font-size="9.5" fill="#475569">extract_all_stored_procedures()</text>
  <text x="337" y="208" text-anchor="middle" font-size="9" fill="#94a3b8" font-style="italic">fetchmany(5000) batching</text>
  <text x="337" y="222" text-anchor="middle" font-size="9" fill="#94a3b8" font-style="italic">JSONL streaming · schema split</text>

  <!-- PurviewClient box -->
  <rect x="250" y="286" width="175" height="164" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="250" y="286" width="175" height="28"  rx="10" fill="#3b82f6"/>
  <rect x="250" y="300" width="175" height="14" fill="#3b82f6"/>
  <text x="337" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">PurviewClient</text>
  <text x="337" y="328" text-anchor="middle" font-size="9.5" fill="#475569">extract_databases()</text>
  <text x="337" y="343" text-anchor="middle" font-size="9.5" fill="#475569">extract_schemas()</text>
  <text x="337" y="358" text-anchor="middle" font-size="9.5" fill="#475569">extract_tables() / views()</text>
  <text x="337" y="373" text-anchor="middle" font-size="9.5" fill="#475569">extract_columns()</text>
  <text x="337" y="393" text-anchor="middle" font-size="9" fill="#94a3b8" font-style="italic">Bulk entity API (20/batch)</text>
  <text x="337" y="407" text-anchor="middle" font-size="9" fill="#94a3b8" font-style="italic">120 s timeout · 3× retry</text>
  <text x="337" y="422" text-anchor="middle" font-size="9" fill="#94a3b8" font-style="italic">referredEntities → columns</text>
  <text x="337" y="437" text-anchor="middle" font-size="9" fill="#94a3b8" font-style="italic">JSONL streaming · schema split</text>

  <!-- ═══ DATA LAYER ═══ -->

  <!-- data/actual/ box -->
  <rect x="490" y="86" width="155" height="148" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="567" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">data/actual/</text>
  <text x="567" y="131" text-anchor="middle" font-size="9.5" fill="#475569">databases.jsonl</text>
  <text x="567" y="146" text-anchor="middle" font-size="9.5" fill="#475569">schemas.jsonl</text>
  <text x="567" y="161" text-anchor="middle" font-size="9.5" fill="#475569">tables.jsonl</text>
  <text x="567" y="176" text-anchor="middle" font-size="9.5" fill="#475569">views.jsonl</text>
  <text x="567" y="191" text-anchor="middle" font-size="9.5" fill="#475569">stored_procedures.jsonl</text>
  <text x="567" y="211" text-anchor="middle" font-size="9" fill="#15803d" font-style="italic">columns/</text>
  <text x="567" y="224" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">└─ &lt;DB&gt;/&lt;SCHEMA&gt;.jsonl</text>

  <!-- data/expected/ box -->
  <rect x="490" y="286" width="155" height="164" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="567" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">data/expected/</text>
  <text x="567" y="331" text-anchor="middle" font-size="9.5" fill="#475569">purview_databases.jsonl</text>
  <text x="567" y="346" text-anchor="middle" font-size="9.5" fill="#475569">purview_schemas.jsonl</text>
  <text x="567" y="361" text-anchor="middle" font-size="9.5" fill="#475569">purview_tables.jsonl</text>
  <text x="567" y="376" text-anchor="middle" font-size="9.5" fill="#475569">purview_views.jsonl</text>
  <text x="567" y="391" text-anchor="middle" font-size="9.5" fill="#475569">purview_stored_procs.jsonl</text>
  <text x="567" y="411" text-anchor="middle" font-size="9" fill="#1d4ed8" font-style="italic">columns/</text>
  <text x="567" y="424" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">└─ &lt;DB&gt;/&lt;SCHEMA&gt;.jsonl</text>
  <text x="567" y="443" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">purview_collection_commercial</text>

  <!-- ═══ COMPARISON + REPORT LAYER ═══ -->

  <!-- Comparator box -->
  <rect x="706" y="155" width="160" height="150" rx="10" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.8"/>
  <rect x="706" y="155" width="160" height="28"  rx="10" fill="#a855f7"/>
  <rect x="706" y="169" width="160" height="14" fill="#a855f7"/>
  <text x="786" y="174" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">comparator.py</text>
  <text x="786" y="198" text-anchor="middle" font-size="9.5" fill="#475569">compare_databases()</text>
  <text x="786" y="213" text-anchor="middle" font-size="9.5" fill="#475569">compare_schemas()</text>
  <text x="786" y="228" text-anchor="middle" font-size="9.5" fill="#475569">compare_tables() / views()</text>
  <text x="786" y="243" text-anchor="middle" font-size="9.5" fill="#475569">compare_columns()</text>
  <text x="786" y="263" text-anchor="middle" font-size="9" fill="#94a3b8" font-style="italic">find_excluded_in_purview()</text>
  <text x="786" y="278" text-anchor="middle" font-size="9" fill="#94a3b8" font-style="italic">find_*_empty_description()</text>
  <text x="786" y="293" text-anchor="middle" font-size="9" fill="#94a3b8" font-style="italic">Set diff by qualifiedName key</text>

  <!-- HTML Report box -->
  <rect x="706" y="355" width="160" height="95" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
  <text x="786" y="383" text-anchor="middle" font-size="11" font-weight="700" fill="#ea580c">HTML Report</text>
  <text x="786" y="401" text-anchor="middle" font-size="9.5" fill="#475569">reports/report.html</text>
  <text x="786" y="416" text-anchor="middle" font-size="9.5" fill="#475569">Extraction summaries</text>
  <text x="786" y="431" text-anchor="middle" font-size="9.5" fill="#475569">Comparison diff tables</text>
  <text x="786" y="446" text-anchor="middle" font-size="9" fill="#94a3b8" font-style="italic">pytest-html · self-contained</text>

  <!-- ═══ PYTEST box (bottom center) ═══ -->
  <rect x="340" y="490" width="280" height="52" rx="10" fill="#1e293b"/>
  <text x="480" y="513" text-anchor="middle" font-size="12" font-weight="700" fill="#f8fafc">pytest test suite</text>
  <text x="480" y="531" text-anchor="middle" font-size="10" fill="#94a3b8">Session fixtures · Markers · Module-scoped extraction</text>

  <!-- ═══ ARROWS ═══ -->

  <!-- Snowflake → SnowflakeClient -->
  <line x1="192" y1="160" x2="248" y2="160" stroke="#29b5e8" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Purview → PurviewClient -->
  <line x1="192" y1="360" x2="248" y2="360" stroke="#0078d4" stroke-width="2" marker-end="url(#arr-azure)"/>

  <!-- SnowflakeClient → data/actual/ -->
  <line x1="425" y1="160" x2="488" y2="160" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- PurviewClient → data/expected/ -->
  <line x1="425" y1="368" x2="488" y2="368" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-indigo)"/>

  <!-- data/actual/ → Comparator -->
  <line x1="645" y1="160" x2="704" y2="210" stroke="#a855f7" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- data/expected/ → Comparator -->
  <line x1="645" y1="368" x2="704" y2="270" stroke="#a855f7" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- Comparator → HTML Report -->
  <line x1="786" y1="305" x2="786" y2="353" stroke="#f97316" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- pytest ↔ all -->
  <line x1="480" y1="490" x2="337" y2="237" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-slate)"/>
  <line x1="480" y1="490" x2="337" y2="453" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-slate)"/>
  <line x1="480" y1="490" x2="786" y2="355" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-slate)"/>

  <!-- ═══ ARROW MARKERS ═══ -->
  <defs>
    <marker id="arr-blue"   markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#29b5e8"/></marker>
    <marker id="arr-azure"  markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#0078d4"/></marker>
    <marker id="arr-green"  markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#22c55e"/></marker>
    <marker id="arr-indigo" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#3b82f6"/></marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#a855f7"/></marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#f97316"/></marker>
    <marker id="arr-slate"  markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#475569"/></marker>
  </defs>

  <!-- Legend -->
  <rect x="32" y="476" width="240" height="68" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="152" y="494" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Legend</text>
  <line x1="44" y1="507" x2="70" y2="507" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="76" y="511" font-size="9.5" fill="#475569">Snowflake extraction</text>
  <line x1="44" y1="523" x2="70" y2="523" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-indigo)"/>
  <text x="76" y="527" font-size="9.5" fill="#475569">Purview extraction</text>
  <line x1="44" y1="539" x2="70" y2="539" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-slate)"/>
  <text x="76" y="543" font-size="9.5" fill="#475569">pytest orchestration</text>

</svg>
